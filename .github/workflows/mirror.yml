name: Mirror to B-Lynk safety repo

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify API access from runner
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          echo "testing API access to mirror repo..."
          http_status=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            -H "Authorization: token ${MIRROR_PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/productionblynk/magnella-account-mirror)
          echo "status: $http_status"
          echo "response (truncated):"
          head -c 300 /tmp/body.txt
          echo

      - name: Try push with username:token format
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          git push --mirror "https://tomastampablynk:${MIRROR_PAT}@github.com/productionblynk/magnella-account-mirror.git" || echo "username:token format failed"

      - name: Try push with x-access-token format
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          git push --mirror "https://x-access-token:${MIRROR_PAT}@github.com/productionblynk/magnella-account-mirror.git"
